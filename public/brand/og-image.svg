<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Fondo de papel cálido (Levantamiento) -->
  <rect width="1200" height="630" fill="#f1ebdc"/>
  <!-- Retícula técnica de fondo -->
  <defs>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Marco técnico exterior -->
  <rect x="60" y="60" width="1080" height="510" stroke="#1a2332" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>

  <!-- Etiquetas de plano -->
  <text x="80" y="95" font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#1a2332" fill-opacity="0.6">REF · CISA-2026</text>
  <text x="1120" y="95" font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#1a2332" fill-opacity="0.6" text-anchor="end">PLANO 01/01</text>

  <!-- Monograma grande -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="180" height="180" stroke="#1a2332" stroke-width="4" fill="none"/>
    <path d="M 142 42 A 56 56 0 1 0 142 138" stroke="#1a2332" stroke-width="4" fill="none" stroke-linecap="square"/>
    <line x1="90" y1="0" x2="90" y2="180" stroke="#1a2332" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="0" y1="90" x2="180" y2="90" stroke="#1a2332" stroke-width="1" stroke-opacity="0.25"/>
  </g>

  <!-- Texto principal -->
  <text x="340" y="240" font-family="'Inter', sans-serif" font-size="14" font-weight="500" letter-spacing="6" fill="#1a2332" fill-opacity="0.7">GRUPO</text>
  <text x="340" y="330" font-family="'Fraunces', serif" font-size="92" font-weight="600" letter-spacing="6" fill="#1a2332">CISA</text>
  <text x="340" y="380" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#1a2332" fill-opacity="0.75">Desarrolladora inmobiliaria</text>
  <text x="340" y="408" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#1a2332" fill-opacity="0.75">CDMX · Estado de México · Querétaro</text>

  <!-- Frase reveladora -->
  <text x="340" y="490" font-family="'Fraunces', serif" font-size="32" font-style="italic" font-weight="500" fill="#8b6f47">«Vender un terreno es una operación.</text>
  <text x="340" y="530" font-family="'Fraunces', serif" font-size="32" font-style="italic" font-weight="500" fill="#8b6f47">Desarrollarlo es un negocio.»</text>

  <!-- Pie con firma -->
  <text x="80" y="540" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5">cisa.mx</text>
  <text x="1120" y="540" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5" text-anchor="end">EST. 2003</text>
</svg>