<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" aria-label="Grupo CISA">
  <!-- Monograma C: cuadrado base + arco interno -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" stroke="currentColor" stroke-width="3" fill="none"/>
    <path d="M 50 20 A 20 20 0 1 0 50 44" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="square"/>
    <line x1="32" y1="0" x2="32" y2="64" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="32" x2="64" y2="32" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <!-- Texto GRUPO -->
  <text x="88" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="currentColor" fill-opacity="0.7">GRUPO</text>
  <!-- Texto CISA -->
  <text x="88" y="62" font-family="'Fraunces', 'Cormorant Garamond', serif" font-size="32" font-weight="600" letter-spacing="4" fill="currentColor">CISA</text>
  <!-- Tagline inferior derecha -->
  <text x="232" y="74" font-family="'Inter', sans-serif" font-size="8" font-weight="400" letter-spacing="2" fill="currentColor" fill-opacity="0.5">EST. 2003</text>
