<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="team-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <pattern id="team-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#team-bg)"/>
  <rect width="400" height="500" fill="url(#team-grid)"/>

  <!-- Marco -->
  <rect x="20" y="20" width="360" height="460" stroke="#1a2332" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  <text x="35" y="42" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5">EQUIPO · PENDIENTE</text>

  <!-- Silueta minimalista -->
  <g transform="translate(200, 230)">
    <!-- Fondo circular con tinte verde -->
    <circle cx="0" cy="-30" r="85" fill="#1f6e3a" fill-opacity="0.08"/>

    <!-- Cabeza -->
    <circle cx="0" cy="-100" r="38" stroke="#1a2332" stroke-width="1.5" fill="#fafaf9"/>
    <!-- Cuerpo -->
    <path d="M -55 -50 Q -55 -56 -49 -56 L 49 -56 Q 55 -56 55 -50 L 55 100 L -55 100 Z"
          stroke="#1a2332" stroke-width="1.5" fill="#fafaf9"/>
    <!-- Inicial -->
    <text x="0" y="-90" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-weight="500" fill="#1a2332" text-anchor="middle" dominant-baseline="middle">?</text>
  </g>

  <!-- Anotación de plano -->
  <g transform="translate(370, 80)">
    <line x1="0" y1="0" x2="0" y2="360" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="-10" y="0" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.5" text-anchor="end">170 cm</text>
  </g>

  <!-- Texto placeholder -->
  <g transform="translate(200, 430)">
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#1a2332" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="2" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">[ FOTO PENDIENTE ]</text>
  </g>
</svg>