<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Patrón de retícula técnica decorativa -->
  <defs>
    <pattern id="decor-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#1a2332" stroke-width="0.4" stroke-opacity="0.4"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1a2332" stroke-width="0.4" stroke-opacity="0.4"/>
    </pattern>
    <pattern id="decor-grid-bold" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#1a2332" stroke-width="0.6" stroke-opacity="0.5"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#1a2332" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#decor-grid)"/>
  <rect width="200" height="200" fill="url(#decor-grid-bold)"/>
  <!-- Cruz de coordenadas -->
  <circle cx="100" cy="100" r="3" fill="#1a2332"/>
  <line x1="100" y1="20" x2="100" y2="180" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
</svg>