<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Inversión: edificios en una ciudad + flecha de crecimiento -->
  <g transform="translate(200, 200)">
    <!-- Línea base -->
    <line x1="-140" y1="80" x2="140" y2="80" stroke="#1a2332" stroke-width="1"/>

    <!-- Edificios de distintos tamaños (ciudad) -->
    <g stroke="#1a2332" stroke-width="1.5" fill="#1a2332" fill-opacity="0.04">
      <rect x="-130" y="20" width="30" height="60"/>
      <rect x="-95" y="-20" width="30" height="100"/>
      <rect x="-60" y="0" width="30" height="80"/>
      <rect x="-25" y="-50" width="35" height="130"/>
      <rect x="20" y="-30" width="30" height="110"/>
      <rect x="55" y="10" width="30" height="70"/>
      <rect x="90" y="-10" width="30" height="90"/>
    </g>

    <!-- Ventanas -->
    <g fill="#1a2332" fill-opacity="0.4">
      <rect x="-125" y="30" width="3" height="3"/>
      <rect x="-115" y="30" width="3" height="3"/>
      <rect x="-125" y="40" width="3" height="3"/>
      <rect x="-115" y="40" width="3" height="3"/>
      <rect x="-90" y="-10" width="3" height="3"/>
      <rect x="-80" y="-10" width="3" height="3"/>
      <rect x="-90" y="0" width="3" height="3"/>
      <rect x="-80" y="0" width="3" height="3"/>
      <rect x="-90" y="10" width="3" height="3"/>
      <rect x="-80" y="10" width="3" height="3"/>
      <rect x="-90" y="20" width="3" height="3"/>
      <rect x="-80" y="20" width="3" height="3"/>
      <rect x="-20" y="-40" width="3" height="3"/>
      <rect x="-10" y="-40" width="3" height="3"/>
      <rect x="-20" y="-30" width="3" height="3"/>
      <rect x="-10" y="-30" width="3" height="3"/>
      <rect x="-20" y="-20" width="3" height="3"/>
      <rect x="-10" y="-20" width="3" height="3"/>
      <rect x="-20" y="-10" width="3" height="3"/>
      <rect x="-10" y="-10" width="3" height="3"/>
      <rect x="25" y="-20" width="3" height="3"/>
      <rect x="35" y="-20" width="3" height="3"/>
      <rect x="25" y="-10" width="3" height="3"/>
      <rect x="35" y="-10" width="3" height="3"/>
      <rect x="25" y="0" width="3" height="3"/>
      <rect x="35" y="0" width="3" height="3"/>
      <rect x="25" y="10" width="3" height="3"/>
      <rect x="35" y="10" width="3" height="3"/>
    </g>

    <!-- Flecha de crecimiento -->
    <g stroke="#1a2332" stroke-width="2" fill="none">
      <path d="M -130 -100 L 130 -100" stroke-dasharray="4 3" stroke-opacity="0.5"/>
      <path d="M 120 -110 L 135 -100 L 120 -90" fill="none"/>
    </g>
    <text x="-130" y="-110" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#1a2332" fill-opacity="0.6">TIEMPO</text>

    <!-- Símbolo central: participación -->
    <circle cx="0" cy="40" r="22" stroke="#1a2332" stroke-width="2" fill="none"/>
    <text x="0" y="45" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#1a2332" text-anchor="middle">%</text>
  </g>

  <text x="200" y="380" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">INVERSIÓN EN PROYECTOS</text>
</svg>