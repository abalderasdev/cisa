<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg-inv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="bldg-inv-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#a89878"/>
    </linearGradient>
    <linearGradient id="bldg-inv-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8bca0"/>
      <stop offset="100%" stop-color="#8a7c60"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg-inv)"/>

  <g transform="translate(200, 240)">
    <!-- Edificios de la "ciudad" (ciudad de inversión) -->
    <g>
      <!-- Edificio 1 -->
      <rect x="-130" y="-40" width="30" height="80" fill="url(#bldg-inv-1)" stroke="#5a4830" stroke-width="1"/>
      <rect x="-126" y="-30" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="-114" y="-30" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="-126" y="-15" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="-114" y="-15" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="-126" y="0" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="-114" y="0" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="-126" y="15" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="-114" y="15" width="8" height="8" fill="#3a4858" opacity="0.6"/>

      <!-- Edificio 2 (más alto) -->
      <rect x="-85" y="-90" width="35" height="130" fill="url(#bldg-inv-2)" stroke="#5a4830" stroke-width="1"/>
      <rect x="-80" y="-80" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-65" y="-80" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-80" y="-65" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-65" y="-65" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-80" y="-50" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-65" y="-50" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-80" y="-35" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-65" y="-35" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-80" y="-20" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-65" y="-20" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-80" y="-5" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-65" y="-5" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-80" y="10" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-65" y="10" width="10" height="10" fill="#3a4858" opacity="0.6"/>

      <!-- Edificio 3 (prominente, más alto) -->
      <rect x="-30" y="-110" width="50" height="150" fill="url(#bldg-inv-1)" stroke="#5a4830" stroke-width="1"/>
      <rect x="-25" y="-100" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-5" y="-100" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-25" y="-82" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-5" y="-82" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-25" y="-64" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-5" y="-64" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-25" y="-46" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-5" y="-46" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-25" y="-28" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-5" y="-28" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-25" y="-10" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-5" y="-10" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-25" y="8" width="12" height="12" fill="#3a4858" opacity="0.6"/>
      <rect x="-5" y="8" width="12" height="12" fill="#3a4858" opacity="0.6"/>

      <!-- Edificio 4 -->
      <rect x="40" y="-60" width="40" height="100" fill="url(#bldg-inv-2)" stroke="#5a4830" stroke-width="1"/>
      <rect x="45" y="-50" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="65" y="-50" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="45" y="-35" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="65" y="-35" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="45" y="-20" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="65" y="-20" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="45" y="-5" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="65" y="-5" width="10" height="10" fill="#3a4858" opacity="0.6"/>

      <!-- Edificio 5 -->
      <rect x="95" y="-30" width="30" height="70" fill="url(#bldg-inv-1)" stroke="#5a4830" stroke-width="1"/>
      <rect x="100" y="-20" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="113" y="-20" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="100" y="-5" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="113" y="-5" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="100" y="10" width="8" height="8" fill="#3a4858" opacity="0.6"/>
      <rect x="113" y="10" width="8" height="8" fill="#3a4858" opacity="0.6"/>
    </g>

    <!-- Símbolo % central (participación) -->
    <circle cx="0" cy="0" r="35" fill="#1f6e3a" stroke="#0f3e1a" stroke-width="2"/>
    <text font-family="'Inter', sans-serif" font-size="32" font-weight="600" fill="#fafaf9" text-anchor="middle" dominant-baseline="middle">%</text>
    <text x="0" y="68" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#1f6e3a" text-anchor="middle">PARTICIPACIÓN</text>

    <!-- Flecha de crecimiento -->
    <g transform="translate(0, -140)">
      <path d="M -130 0 L 130 0" stroke="#1f6e3a" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="125,-5 135,0 125,5" fill="#1f6e3a"/>
      <text x="-135" y="-8" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#1f6e3a">CRECIMIENTO</text>
    </g>
  </g>

  <!-- Texto -->
  <g transform="translate(200, 360)">
    <rect x="-90" y="-15" width="180" height="30" fill="#1f6e3a" rx="15"/>
    <text font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#fafaf9" text-anchor="middle">INVERSIÓN EN PROYECTOS</text>
  </g>
</svg>