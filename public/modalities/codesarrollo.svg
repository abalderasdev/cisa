<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Co-desarrollo: dos manos entrelazadas formando una estructura -->
  <g transform="translate(200, 200)">
    <!-- Estructura geométrica central (edificio en planta) -->
    <g transform="translate(0, -20)">
      <rect x="-50" y="-50" width="100" height="100" stroke="#1a2332" stroke-width="2" fill="none"/>
      <line x1="-50" y1="0" x2="50" y2="0" stroke="#1a2332" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#1a2332" stroke-width="1" stroke-opacity="0.5"/>
      <!-- Cuatro cuadrantes marcados -->
      <text x="-25" y="-25" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">A</text>
      <text x="25" y="-25" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">B</text>
      <text x="-25" y="25" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">C</text>
      <text x="25" y="25" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">D</text>
    </g>

    <!-- Dos siluetas: ABDev (izquierda) y Socio (derecha) -->
    <g transform="translate(-130, 0)">
      <!-- Cabeza -->
      <circle cx="0" cy="-50" r="14" stroke="#1a2332" stroke-width="1.5" fill="none"/>
      <!-- Cuerpo -->
      <path d="M -20 -30 L -20 50 L 20 50 L 20 -30 Q 20 -38 14 -38 L -14 -38 Q -20 -38 -20 -30 Z"
            stroke="#1a2332" stroke-width="1.5" fill="none"/>
      <!-- Mano extendida -->
      <path d="M 18 0 L 50 0" stroke="#1a2332" stroke-width="2"/>
      <text x="0" y="80" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">ABDEV</text>
    </g>

    <g transform="translate(130, 0)">
      <circle cx="0" cy="-50" r="14" stroke="#1a2332" stroke-width="1.5" fill="none"/>
      <path d="M -20 -30 L -20 50 L 20 50 L 20 -30 Q 20 -38 14 -38 L -14 -38 Q -20 -38 -20 -30 Z"
            stroke="#1a2332" stroke-width="1.5" fill="none"/>
      <path d="M -18 0 L -50 0" stroke="#1a2332" stroke-width="2"/>
      <text x="0" y="80" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">SOCIO</text>
    </g>

    <!-- Líneas conectoras -->
    <line x1="-110" y1="0" x2="-50" y2="-30" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="3 2"/>
    <line x1="110" y1="0" x2="50" y2="-30" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="3 2"/>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
  </g>

  <text x="200" y="380" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">CO-DESARROLLO</text>
</svg>