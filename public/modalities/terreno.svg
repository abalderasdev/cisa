<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg-ter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="ground-ter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7858"/>
      <stop offset="100%" stop-color="#5a4830"/>
    </linearGradient>
    <linearGradient id="bldg-ter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#c8bca0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="400" height="400" fill="url(#bg-ter)"/>

  <!-- Terreno isométrico -->
  <g transform="translate(200, 220)">
    <!-- Lote de terreno (vista superior isométrica) -->
    <polygon points="-100,-50 100,-50 80,30 -120,30" fill="url(#ground-ter)" stroke="#3a2818" stroke-width="2"/>
    <!-- Borde superior -->
    <line x1="-100" y1="-50" x2="100" y2="-50" stroke="#3a2818" stroke-width="2"/>

    <!-- Líneas divisorias del lote -->
    <line x1="-30" y1="-50" x2="-40" y2="30" stroke="#3a2818" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="40" y1="-50" x2="30" y2="30" stroke="#3a2818" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Edificio que ATERRIZA sobre el terreno (perspectiva isométrica) -->
    <g transform="translate(40, -100)">
      <!-- Sombra -->
      <polygon points="0,40 60,10 120,10 180,40 180,80 120,110 60,110 0,80" fill="#000" fill-opacity="0.15" transform="translate(-90, 50)"/>
      <!-- Cuerpo -->
      <polygon points="0,40 60,10 120,10 180,40 180,80 120,110 60,110 0,80" fill="url(#bldg-ter)" stroke="#5a4830" stroke-width="2"/>
      <!-- Ventanas -->
      <rect x="30" y="50" width="15" height="15" fill="#3a4858" opacity="0.7"/>
      <rect x="55" y="40" width="15" height="15" fill="#3a4858" opacity="0.7"/>
      <rect x="105" y="40" width="15" height="15" fill="#3a4858" opacity="0.7"/>
      <rect x="130" y="50" width="15" height="15" fill="#3a4858" opacity="0.7"/>
    </g>

    <!-- Flecha indicando la transformación -->
    <g transform="translate(-160, -60)">
      <path d="M 0 0 L 30 0" stroke="#1f6e3a" stroke-width="2" fill="none"/>
      <polygon points="30,-5 38,0 30,5" fill="#1f6e3a"/>
      <text x="-30" y="-8" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#1f6e3a" text-anchor="end">APORTAR</text>
    </g>
  </g>

  <!-- Texto -->
  <g transform="translate(200, 360)">
    <rect x="-90" y="-15" width="180" height="30" fill="#1f6e3a" rx="15"/>
    <text font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#fafaf9" text-anchor="middle">APORTACIÓN DE TERRENO</text>
  </g>
</svg>