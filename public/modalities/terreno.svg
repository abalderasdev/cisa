<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Terreno: una mano deja caer una semilla en un lote -->
  <g transform="translate(200, 200)">
    <!-- Polígono del terreno -->
    <polygon points="-130,-60 80,-90 130,40 -100,90" stroke="#1a2332" stroke-width="2.5" fill="none"/>
    <!-- Cota interior -->
    <line x1="-130" y1="20" x2="130" y2="20" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <text x="-110" y="105" font-family="'Inter', sans-serif" font-size="9" fill="#1a2332" fill-opacity="0.6">TERRENO APORTADO</text>

    <!-- Mano estilizada (silueta) -->
    <g transform="translate(-30, -140)">
      <path d="M 0 0 L 0 -50 Q 0 -60 10 -60 Q 20 -60 20 -50 L 20 -30
               Q 25 -30 25 -40 L 25 -70 Q 25 -80 35 -80 Q 45 -80 45 -70 L 45 -40
               L 50 -40 Q 60 -40 60 -50 L 60 -60 Q 60 -70 70 -70 Q 80 -70 80 -60 L 80 -10
               Q 80 30 60 50 L 30 70 Q 0 75 -20 60 L -30 30 Q -35 10 -30 -10 Z"
            stroke="#1a2332" stroke-width="1.5" fill="none"/>
      <!-- Semilla cayendo -->
      <ellipse cx="40" cy="120" rx="4" ry="6" fill="#1a2332"/>
      <line x1="40" y1="100" x2="40" y2="115" stroke="#1a2332" stroke-width="0.8" stroke-dasharray="2 2"/>
    </g>

    <!-- Brote que crece desde el centro -->
    <g transform="translate(20, 0)">
      <line x1="0" y1="0" x2="0" y2="-25" stroke="#1a2332" stroke-width="1.5"/>
      <path d="M 0 -25 Q -15 -28 -20 -15" stroke="#1a2332" stroke-width="1.5" fill="none"/>
      <path d="M 0 -20 Q 15 -23 20 -10" stroke="#1a2332" stroke-width="1.5" fill="none"/>
      <circle cx="0" cy="-30" r="3" fill="#1a2332"/>
    </g>

    <!-- Flecha de tiempo -->
    <g transform="translate(160, -60)">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1a2332" stroke-width="1"/>
      <path d="M 36 -4 L 42 0 L 36 4" stroke="#1a2332" stroke-width="1" fill="none"/>
      <text x="20" y="-8" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">TIEMPO</text>
    </g>
  </g>

  <text x="200" y="380" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">APORTACIÓN DE TERRENO</text>
</svg>