<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg-con" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="bldg-con" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8bca0"/>
      <stop offset="100%" stop-color="#8a7c60"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg-con)"/>

  <g transform="translate(200, 230)">
    <!-- Sombra del edificio en proceso -->
    <polygon points="-50,30 50,-10 90,10 -90,50" fill="#000" fill-opacity="0.15"/>

    <!-- Edificio en proceso (esqueleto + concreto) -->
    <g transform="translate(0, -100)">
      <!-- Cuerpo principal (sin terminar) -->
      <polygon points="-50,0 0,-30 50,0 50,80 0,110 -50,80" fill="url(#bldg-con)" stroke="#3a2818" stroke-width="2"/>

      <!-- Pisos demarcados (líneas de encofrado) -->
      <line x1="-50" y1="20" x2="50" y2="20" stroke="#3a2818" stroke-width="1.5"/>
      <line x1="-50" y1="40" x2="50" y2="40" stroke="#3a2818" stroke-width="1.5"/>
      <line x1="-50" y1="60" x2="50" y2="60" stroke="#3a2818" stroke-width="1.5"/>

      <!-- Algunas ventanas ya instaladas -->
      <rect x="-30" y="25" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="-15" y="10" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="15" y="10" width="10" height="10" fill="#3a4858" opacity="0.6"/>
      <rect x="30" y="25" width="10" height="10" fill="#3a4858" opacity="0.6"/>

      <!-- Grúa -->
      <g transform="translate(80, -10)">
        <line x1="0" y1="0" x2="0" y2="120" stroke="#d4c11a" stroke-width="3"/>
        <line x1="0" y1="0" x2="60" y2="0" stroke="#d4c11a" stroke-width="3"/>
        <line x1="0" y1="0" x2="-12" y2="12" stroke="#d4c11a" stroke-width="3"/>
        <!-- Cable -->
        <line x1="40" y1="0" x2="40" y2="35" stroke="#3a2818" stroke-width="1"/>
        <!-- Carga -->
        <rect x="36" y="35" width="8" height="6" fill="#3a2818"/>
      </g>
    </g>

    <!-- Cascos de obra -->
    <g transform="translate(-110, 60)">
      <ellipse cx="0" cy="0" rx="22" ry="6" fill="#d4c11a"/>
      <ellipse cx="0" cy="-2" rx="22" ry="8" fill="#d4c11a"/>
    </g>
    <g transform="translate(110, 80)">
      <ellipse cx="0" cy="0" rx="22" ry="6" fill="#d4c11a"/>
      <ellipse cx="0" cy="-2" rx="22" ry="8" fill="#d4c11a"/>
    </g>
  </g>

  <!-- Texto -->
  <g transform="translate(200, 360)">
    <rect x="-110" y="-15" width="220" height="30" fill="#1f6e3a" rx="15"/>
    <text font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#fafaf9" text-anchor="middle">CONSTRUCCIÓN POR ENCARGO</text>
  </g>
</svg>