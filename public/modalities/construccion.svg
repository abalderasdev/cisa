<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Construcción: casco de obra + edificio en proceso -->
  <g transform="translate(200, 200)">
    <!-- Casco de obra (silueta frontal) -->
    <g transform="translate(0, 20)">
      <!-- Cabeza -->
      <circle cx="0" cy="-100" r="20" stroke="#1a2332" stroke-width="2" fill="#1a2332" fill-opacity="0.08"/>
      <!-- Casco -->
      <path d="M -28 -110 Q 0 -130 28 -110 L 28 -100 L -28 -100 Z" stroke="#1a2332" stroke-width="2" fill="#1a2332" fill-opacity="0.15"/>
      <!-- Cresta del casco -->
      <line x1="-28" y1="-110" x2="28" y2="-110" stroke="#1a2332" stroke-width="1.5"/>
      <!-- Cuerpo -->
      <path d="M -32 -90 L -32 50 L 32 50 L 32 -90 Q 32 -100 22 -100 L -22 -100 Q -32 -100 -32 -90 Z"
            stroke="#1a2332" stroke-width="2" fill="none"/>
      <!-- Chaleco reflectante (líneas) -->
      <line x1="-32" y1="-30" x2="32" y2="-30" stroke="#1a2332" stroke-width="1.5"/>
      <line x1="-32" y1="-20" x2="32" y2="-20" stroke="#1a2332" stroke-width="1.5"/>
    </g>

    <!-- Edificio en construcción detrás (líneas ascendentes) -->
    <g transform="translate(80, -40)" stroke="#1a2332" stroke-width="1.5" fill="none" stroke-opacity="0.6">
      <rect x="0" y="0" width="50" height="100"/>
      <rect x="55" y="-20" width="40" height="120"/>
      <line x1="0" y1="20" x2="50" y2="20"/>
      <line x1="0" y1="40" x2="50" y2="40"/>
      <line x1="0" y1="60" x2="50" y2="60"/>
      <line x1="0" y1="80" x2="50" y2="80"/>
      <line x1="55" y1="0" x2="95" y2="0"/>
      <line x1="55" y1="20" x2="95" y2="20"/>
      <line x1="55" y1="40" x2="95" y2="40"/>
      <line x1="55" y1="60" x2="95" y2="60"/>
      <line x1="55" y1="80" x2="95" y2="80"/>
    </g>

    <!-- Grúa estilizada -->
    <g transform="translate(-100, -100)" stroke="#1a2332" stroke-width="1.5" fill="none" stroke-opacity="0.5">
      <line x1="0" y1="0" x2="0" y2="160"/>
      <line x1="0" y1="0" x2="80" y2="0"/>
      <line x1="0" y1="0" x2="-15" y2="15"/>
      <line x1="60" y1="0" x2="60" y2="20"/>
      <rect x="58" y="20" width="6" height="4"/>
    </g>
  </g>

  <text x="200" y="380" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">CONSTRUCCIÓN POR ENCARGO</text>
</svg>