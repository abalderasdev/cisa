<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Fondo cálido -->
  <rect width="800" height="600" fill="#f1ebdc"/>
  <!-- Retícula técnica sutil -->
  <defs>
    <pattern id="grid-cal" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid-cal)"/>

  <!-- Marco de plano -->
  <rect x="40" y="40" width="720" height="520" stroke="#1a2332" stroke-width="1" stroke-opacity="0.3" fill="none"/>

  <!-- Etiquetas tipo plano -->
  <text x="60" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5">REF · 001 — CALAC</text>
  <text x="740" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5" text-anchor="end">ESC 1:200</text>

  <!-- Polígono del terreno (vista cenital) -->
  <g transform="translate(120, 130)">
    <!-- Terreno base -->
    <polygon points="40,40 480,40 480,360 40,360" stroke="#1a2332" stroke-width="2" fill="none"/>
    <text x="50" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#1a2332" fill-opacity="0.6">TERRENO · 12,400 m²</text>

    <!-- Calles perimetrales -->
    <line x1="0" y1="40" x2="800" y2="40" stroke="#1a2332" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 3"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#1a2332" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 3"/>
    <text x="500" y="36" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.5">CALLE BOSQUES</text>
    <text x="500" y="376" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.5">AV. PRINCIPAL</text>

    <!-- Casas (11) -->
    <g stroke="#1a2332" stroke-width="1.5" fill="none">
      <rect x="80" y="80" width="50" height="40"/>
      <rect x="140" y="80" width="50" height="40"/>
      <rect x="200" y="80" width="50" height="40"/>
      <rect x="260" y="80" width="50" height="40"/>
      <rect x="320" y="80" width="50" height="40"/>
      <rect x="380" y="80" width="50" height="40"/>
    </g>
    <text x="80" y="76" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6">CASAS 1-6</text>

    <!-- Departamentos (3 bloques) -->
    <g stroke="#1a2332" stroke-width="1.5" fill="none">
      <rect x="80" y="170" width="100" height="60"/>
      <rect x="190" y="170" width="100" height="60"/>
      <rect x="300" y="170" width="100" height="60"/>
      <text x="100" y="200" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332">DEPT A</text>
      <text x="210" y="200" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332">DEPT B</text>
      <text x="320" y="200" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332">DEPT C</text>
    </g>

    <!-- Departamentos segundo nivel (8 unidades por bloque) -->
    <g stroke="#1a2332" stroke-width="1" fill="none">
      <rect x="80" y="245" width="40" height="80"/>
      <rect x="120" y="245" width="40" height="80"/>
      <rect x="190" y="245" width="40" height="80"/>
      <rect x="230" y="245" width="40" height="80"/>
      <rect x="300" y="245" width="40" height="80"/>
      <rect x="340" y="245" width="40" height="80"/>
    </g>
    <text x="410" y="290" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6">×3 PISOS</text>
    <text x="410" y="300" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6">24 UNID</text>

    <!-- Áreas verdes -->
    <g fill="#1a2332" fill-opacity="0.08">
      <rect x="80" y="335" width="60" height="15"/>
      <rect x="200" y="335" width="100" height="15"/>
      <rect x="360" y="335" width="60" height="15"/>
    </g>
    <text x="80" y="328" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6">ÁREAS VERDES</text>
  </g>

  <!-- Título inferior -->
  <g transform="translate(120, 530)">
    <text font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.6">PROYECTO 01 · ATIZAPÁN, EDO. MÉX.</text>
    <text y="22" font-family="'Fraunces', serif" font-size="22" font-weight="600" fill="#1a2332">Bosques de Calacoaya</text>
    <text y="40" font-family="'Inter', sans-serif" font-size="11" fill="#1a2332" fill-opacity="0.7">24 departamentos de 120 m² · 11 casas de 183 m²</text>
  </g>

  <!-- Sello de coordenadas -->
  <g transform="translate(680, 510)">
    <rect x="0" y="0" width="60" height="60" stroke="#1a2332" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    <text x="30" y="20" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">N ↑</text>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="30" y="42" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">19°33'N</text>
    <text x="30" y="52" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">99°13'O</text>
  </g>
</svg>