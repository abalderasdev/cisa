<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <!-- Gradiente de cielo -->
    <linearGradient id="sky-cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0f5"/>
      <stop offset="60%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#ede5d4"/>
    </linearGradient>
    <!-- Sombra -->
    <radialGradient id="ground-cal" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#3a3a3a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3a3a3a" stop-opacity="0"/>
    </radialGradient>
    <!-- Textura pared -->
    <linearGradient id="wall-cal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#e8e3d8"/>
    </linearGradient>
    <linearGradient id="roof-cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a55"/>
      <stop offset="100%" stop-color="#3a3a35"/>
    </linearGradient>
    <linearGradient id="window-cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3540"/>
      <stop offset="100%" stop-color="#4a5560"/>
    </linearGradient>
    <linearGradient id="garden-cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8a55"/>
      <stop offset="100%" stop-color="#5a6a45"/>
    </linearGradient>
  </defs>

  <!-- Cielo -->
  <rect width="800" height="600" fill="url(#sky-cal)"/>

  <!-- Suelo base -->
  <ellipse cx="400" cy="500" rx="500" ry="40" fill="url(#ground-cal)"/>
  <rect x="0" y="490" width="800" height="110" fill="#8a8478"/>

  <!-- Carretera -->
  <rect x="0" y="540" width="800" height="60" fill="#3a3a35"/>
  <line x1="0" y1="568" x2="800" y2="568" stroke="#d4c11a" stroke-width="2" stroke-dasharray="20 15"/>

  <!-- Casas en perspectiva -->
  <g transform="translate(80, 200)">
    <!-- Casa 1 -->
    <g>
      <!-- Cuerpo -->
      <polygon points="0,80 80,40 240,40 240,160 160,200 0,200" fill="url(#wall-cal)" stroke="#a8a398" stroke-width="1"/>
      <!-- Techo -->
      <polygon points="0,80 80,40 240,40 240,80 80,120" fill="url(#roof-cal)" stroke="#3a3a35" stroke-width="1"/>
      <!-- Sombra lateral -->
      <polygon points="240,40 240,160 160,200 160,80" fill="#000" fill-opacity="0.15"/>
      <!-- Puerta -->
      <rect x="60" y="130" width="22" height="50" fill="url(#window-cal)"/>
      <rect x="62" y="132" width="18" height="46" fill="#1a2332"/>
      <!-- Ventanas -->
      <rect x="100" y="100" width="22" height="22" fill="url(#window-cal)"/>
      <rect x="135" y="100" width="22" height="22" fill="url(#window-cal)"/>
      <rect x="170" y="100" width="22" height="22" fill="url(#window-cal)"/>
    </g>

    <!-- Casa 2 -->
    <g transform="translate(280, 0)">
      <polygon points="0,80 80,40 240,40 240,160 160,200 0,200" fill="url(#wall-cal)" stroke="#a8a398" stroke-width="1"/>
      <polygon points="0,80 80,40 240,40 240,80 80,120" fill="url(#roof-cal)" stroke="#3a3a35" stroke-width="1"/>
      <polygon points="240,40 240,160 160,200 160,80" fill="#000" fill-opacity="0.15"/>
      <rect x="60" y="130" width="22" height="50" fill="url(#window-cal)"/>
      <rect x="100" y="100" width="22" height="22" fill="url(#window-cal)"/>
      <rect x="135" y="100" width="22" height="22" fill="url(#window-cal)"/>
      <rect x="170" y="100" width="22" height="22" fill="url(#window-cal)"/>
    </g>

    <!-- Casa 3 -->
    <g transform="translate(560, 0)">
      <polygon points="0,80 80,40 240,40 240,160 160,200 0,200" fill="url(#wall-cal)" stroke="#a8a398" stroke-width="1"/>
      <polygon points="0,80 80,40 240,40 240,80 80,120" fill="url(#roof-cal)" stroke="#3a3a35" stroke-width="1"/>
      <polygon points="240,40 240,160 160,200 160,80" fill="#000" fill-opacity="0.15"/>
      <rect x="60" y="130" width="22" height="50" fill="url(#window-cal)"/>
      <rect x="100" y="100" width="22" height="22" fill="url(#window-cal)"/>
      <rect x="135" y="100" width="22" height="22" fill="url(#window-cal)"/>
      <rect x="170" y="100" width="22" height="22" fill="url(#window-cal)"/>
    </g>
  </g>

  <!-- Jardín -->
  <g>
    <ellipse cx="200" cy="490" rx="100" ry="15" fill="url(#garden-cal)" opacity="0.7"/>
    <ellipse cx="500" cy="490" rx="120" ry="18" fill="url(#garden-cal)" opacity="0.7"/>
    <ellipse cx="720" cy="490" rx="80" ry="12" fill="url(#garden-cal)" opacity="0.7"/>
  </g>

  <!-- Árboles -->
  <g>
    <ellipse cx="100" cy="450" rx="20" ry="40" fill="#3a5a30"/>
    <rect x="98" y="450" width="4" height="35" fill="#5a4a35"/>
    <ellipse cx="450" cy="450" rx="22" ry="42" fill="#3a5a30"/>
    <rect x="448" y="450" width="4" height="38" fill="#5a4a35"/>
    <ellipse cx="680" cy="450" rx="18" ry="35" fill="#3a5a30"/>
    <rect x="678" y="450" width="4" height="33" fill="#5a4a35"/>
  </g>

  <!-- Texto / etiqueta -->
  <g transform="translate(40, 50)">
    <text font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.7">BOSQUES DE CALAC OAYA</text>
    <text y="20" font-family="'Inter', sans-serif" font-size="10" fill="#1a2332" fill-opacity="0.5">Atizapán · Edo. Méx.</text>
  </g>

  <!-- Esquina inferior -->
  <g transform="translate(720, 560)">
    <text font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" fill="#fafaf9" fill-opacity="0.7" text-anchor="end">24 dept · 11 casas</text>
  </g>
</svg>