<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#f1ebdc"/>
  <defs>
    <pattern id="grid-bom" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid-bom)"/>

  <rect x="40" y="40" width="720" height="520" stroke="#1a2332" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  <text x="60" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5">REF · 003 — BOMA</text>
  <text x="740" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5" text-anchor="end">ESC 1:250</text>

  <g transform="translate(140, 100)">
    <!-- Torre de consultorios médicos - vista en planta -->
    <rect x="0" y="0" width="520" height="380" stroke="#1a2332" stroke-width="2" fill="none"/>

    <!-- Grid interno -->
    <g stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.4">
      <line x1="0" y1="60" x2="520" y2="60"/>
      <line x1="0" y1="120" x2="520" y2="120"/>
      <line x1="0" y1="180" x2="520" y2="180"/>
      <line x1="0" y1="240" x2="520" y2="240"/>
      <line x1="0" y1="300" x2="520" y2="300"/>
      <line x1="80" y1="0" x2="80" y2="380"/>
      <line x1="160" y1="0" x2="160" y2="380"/>
      <line x1="240" y1="0" x2="240" y2="380"/>
      <line x1="320" y1="0" x2="320" y2="380"/>
      <line x1="400" y1="0" x2="400" y2="380"/>
      <line x1="480" y1="0" x2="480" y2="380"/>
    </g>

    <!-- Núcleo central (circulación / elevadores) -->
    <rect x="220" y="160" width="80" height="60" stroke="#1a2332" stroke-width="1.5" fill="#1a2332" fill-opacity="0.1"/>
    <text x="260" y="195" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">NÚCLEO</text>

    <!-- Consultorios tipo (12 unidades) -->
    <g stroke="#1a2332" stroke-width="1" fill="none">
      <rect x="20" y="20" width="100" height="60"/>
      <rect x="20" y="100" width="100" height="60"/>
      <rect x="20" y="240" width="100" height="60"/>
      <rect x="20" y="320" width="100" height="40"/>
      <rect x="140" y="20" width="60" height="60"/>
      <rect x="320" y="20" width="60" height="60"/>
      <rect x="400" y="20" width="100" height="60"/>
      <rect x="400" y="100" width="100" height="60"/>
      <rect x="320" y="100" width="60" height="60"/>
      <rect x="320" y="240" width="60" height="60"/>
      <rect x="400" y="240" width="100" height="60"/>
      <rect x="400" y="320" width="100" height="40"/>
    </g>

    <!-- Locales comerciales en PB -->
    <g stroke="#1a2332" stroke-width="1.5" fill="#1a2332" fill-opacity="0.05">
      <rect x="20" y="240" width="100" height="20"/>
      <rect x="400" y="240" width="100" height="20"/>
    </g>
    <text x="70" y="254" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">LOCAL 01</text>
    <text x="450" y="254" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">LOCAL 02</text>

    <!-- Marcas de consultorios -->
    <g font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5">
      <text x="70" y="55" text-anchor="middle">CONS 01</text>
      <text x="70" y="135" text-anchor="middle">CONS 02</text>
      <text x="170" y="55" text-anchor="middle">CONS 03</text>
      <text x="350" y="55" text-anchor="middle">CONS 04</text>
      <text x="450" y="55" text-anchor="middle">CONS 05</text>
      <text x="450" y="135" text-anchor="middle">CONS 06</text>
      <text x="350" y="135" text-anchor="middle">CONS 07</text>
      <text x="350" y="275" text-anchor="middle">CONS 08</text>
      <text x="450" y="275" text-anchor="middle">CONS 09</text>
    </g>

    <!-- Cotas de altura (esquina) -->
    <g transform="translate(540, 0)">
      <line x1="0" y1="0" x2="0" y2="380" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="6" y="20" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.5">N+7</text>
      <text x="6" y="80" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.5">N+6</text>
      <text x="6" y="140" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.5">N+5</text>
      <text x="6" y="200" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.5">N+4</text>
      <text x="6" y="260" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.5">N+3</text>
      <text x="6" y="320" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.5">N+2</text>
      <text x="6" y="375" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.5">PB</text>
    </g>

    <!-- Tags de uso -->
    <text x="260" y="-15" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">USO MIXTO · CONSULTORIOS + COMERCIO</text>
  </g>

  <g transform="translate(120, 530)">
    <text font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.6">PROYECTO 03 · QUERÉTARO</text>
    <text y="22" font-family="'Fraunces', serif" font-size="22" font-weight="600" fill="#1a2332">Bomadica</text>
    <text y="40" font-family="'Inter', sans-serif" font-size="11" fill="#1a2332" fill-opacity="0.7">Torre de consultorios médicos y locales comerciales</text>
  </g>

  <g transform="translate(680, 510)">
    <rect x="0" y="0" width="60" height="60" stroke="#1a2332" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    <text x="30" y="20" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">N ↑</text>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="30" y="42" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">20°35'N</text>
    <text x="30" y="52" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">100°23'O</text>
  </g>
</svg>