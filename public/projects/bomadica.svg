<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky-bom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e0d0"/>
      <stop offset="60%" stop-color="#e8e0d4"/>
      <stop offset="100%" stop-color="#d4ccbc"/>
    </linearGradient>
    <linearGradient id="building-bom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0dccd"/>
      <stop offset="50%" stop-color="#f0ecde"/>
      <stop offset="100%" stop-color="#c8c2b2"/>
    </linearGradient>
    <linearGradient id="window-bom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6a78"/>
      <stop offset="100%" stop-color="#7a8a98"/>
    </linearGradient>
    <linearGradient id="ground-bom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a8474"/>
      <stop offset="100%" stop-color="#5a5444"/>
    </linearGradient>
    <linearGradient id="shadow-bom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky-bom)"/>

  <!-- Vegetación de fondo -->
  <g opacity="0.4">
    <ellipse cx="80" cy="320" rx="50" ry="80" fill="#3a5a30"/>
    <ellipse cx="150" cy="340" rx="40" ry="60" fill="#3a5a30"/>
    <ellipse cx="700" cy="320" rx="60" ry="90" fill="#3a5a30"/>
    <ellipse cx="760" cy="340" rx="40" ry="60" fill="#3a5a30"/>
  </g>

  <!-- Suelo -->
  <rect x="0" y="480" width="800" height="120" fill="url(#ground-bom)"/>

  <!-- Torre principal (más alta, aspecto institucional) -->
  <g transform="translate(180, 60)">
    <!-- Cuerpo principal -->
    <rect x="0" y="0" width="380" height="420" fill="url(#building-bom)" stroke="#6a6454" stroke-width="1"/>

    <!-- Sombra lateral -->
    <rect x="360" y="0" width="20" height="420" fill="url(#shadow-bom)"/>

    <!-- Franja superior / cornisa -->
    <rect x="-15" y="-12" width="410" height="20" fill="#5a4a35"/>
    <rect x="-15" y="-12" width="410" height="6" fill="#3a2a1a"/>

    <!-- PB - locales comerciales (más grande, más oscuro) -->
    <rect x="0" y="350" width="380" height="70" fill="#4a3a2a"/>
    <rect x="20" y="365" width="160" height="40" fill="#1a1a15"/>
    <rect x="200" y="365" width="160" height="40" fill="#1a1a15"/>
    <rect x="100" y="365" width="80" height="40" fill="#d4c11a" fill-opacity="0.25"/>
    <!-- Señalética -->
    <rect x="80" y="375" width="120" height="20" fill="#fafaf9" fill-opacity="0.9"/>

    <!-- Ventanas - grid más denso (uso mixto) -->
    <g>
      <!-- Piso 7 -->
      <rect x="20" y="20" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="72" y="20" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="124" y="20" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="176" y="20" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="228" y="20" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="280" y="20" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="332" y="20" width="30" height="35" fill="url(#window-bom)"/>

      <!-- Piso 6 -->
      <rect x="20" y="65" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="72" y="65" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="124" y="65" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="176" y="65" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="228" y="65" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="280" y="65" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="332" y="65" width="30" height="35" fill="url(#window-bom)"/>

      <!-- Pisos 3-5 -->
      <rect x="20" y="110" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="72" y="110" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="124" y="110" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="176" y="110" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="228" y="110" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="280" y="110" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="332" y="110" width="30" height="35" fill="url(#window-bom)"/>

      <rect x="20" y="155" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="72" y="155" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="124" y="155" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="176" y="155" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="228" y="155" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="280" y="155" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="332" y="155" width="30" height="35" fill="url(#window-bom)"/>

      <rect x="20" y="200" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="72" y="200" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="124" y="200" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="176" y="200" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="228" y="200" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="280" y="200" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="332" y="200" width="30" height="35" fill="url(#window-bom)"/>

      <!-- Piso 2 -->
      <rect x="20" y="245" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="72" y="245" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="124" y="245" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="176" y="245" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="228" y="245" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="280" y="245" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="332" y="245" width="30" height="35" fill="url(#window-bom)"/>

      <!-- Piso 1 (consultorios) -->
      <rect x="20" y="290" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="72" y="290" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="124" y="290" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="176" y="290" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="228" y="290" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="280" y="290" width="42" height="35" fill="url(#window-bom)"/>
      <rect x="332" y="290" width="30" height="35" fill="url(#window-bom)"/>
    </g>

    <!-- Reflejos en algunas ventanas (luz interior encendida) -->
    <rect x="72" y="22" width="18" height="12" fill="#f5d090" fill-opacity="0.5"/>
    <rect x="228" y="67" width="18" height="12" fill="#f5d090" fill-opacity="0.5"/>
    <rect x="124" y="112" width="18" height="12" fill="#f5d090" fill-opacity="0.5"/>
    <rect x="280" y="202" width="18" height="12" fill="#f5d090" fill-opacity="0.5"/>
    <rect x="176" y="247" width="18" height="12" fill="#f5d090" fill-opacity="0.5"/>
    <rect x="332" y="292" width="14" height="12" fill="#f5d090" fill-opacity="0.5"/>
  </g>

  <!-- Texto / etiqueta -->
  <g transform="translate(40, 50)">
    <text font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.85">BOMADICA</text>
    <text y="20" font-family="'Inter', sans-serif" font-size="10" fill="#1a2332" fill-opacity="0.6">Querétaro</text>
  </g>

  <g transform="translate(720, 560)">
    <text font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" fill="#fafaf9" fill-opacity="0.8" text-anchor="end">Consultorios + locales</text>
  </g>
</svg>