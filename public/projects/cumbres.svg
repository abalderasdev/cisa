<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky-cum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d8a8"/>
      <stop offset="40%" stop-color="#f0c890"/>
      <stop offset="80%" stop-color="#c8a878"/>
      <stop offset="100%" stop-color="#8a7858"/>
    </linearGradient>
    <linearGradient id="water-cum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6a78"/>
      <stop offset="50%" stop-color="#3a4858"/>
      <stop offset="100%" stop-color="#2a3848"/>
    </linearGradient>
    <linearGradient id="sun-cum" cx="0.7" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#f5d090" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f5d090" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wall-cum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="100%" stop-color="#c8bca0"/>
    </linearGradient>
    <linearGradient id="roof-cum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a30"/>
      <stop offset="100%" stop-color="#3a2a1a"/>
    </linearGradient>
  </defs>

  <!-- Cielo de atardecer -->
  <rect width="800" height="600" fill="url(#sky-cum)"/>

  <!-- Sol -->
  <circle cx="640" cy="180" r="55" fill="#f5c878"/>
  <circle cx="640" cy="180" r="80" fill="url(#sun-cum)"/>

  <!-- Montañas de fondo -->
  <g opacity="0.5">
    <polygon points="0,350 200,250 380,310 580,240 800,310 800,400 0,400" fill="#4a3a25"/>
  </g>

  <!-- Lago -->
  <rect x="0" y="420" width="800" height="180" fill="url(#water-cum)"/>
  <!-- Reflejos del sol en el agua -->
  <ellipse cx="640" cy="430" rx="80" ry="6" fill="#f5d090" fill-opacity="0.6"/>
  <ellipse cx="640" cy="450" rx="60" ry="3" fill="#f5d090" fill-opacity="0.4"/>
  <ellipse cx="640" cy="470" rx="40" ry="2" fill="#f5d090" fill-opacity="0.3"/>

  <!-- Líneas de agua -->
  <g stroke="#fafaf9" stroke-opacity="0.15" fill="none">
    <path d="M 0 440 Q 200 442 400 440 T 800 440"/>
    <path d="M 0 480 Q 200 478 400 480 T 800 480"/>
    <path d="M 0 520 Q 200 522 400 520 T 800 520"/>
    <path d="M 0 560 Q 200 558 400 560 T 800 560"/>
  </g>

  <!-- Casa moderna con vista al lago -->
  <g transform="translate(180, 230)">
    <!-- Casa principal (bloque horizontal grande) -->
    <polygon points="0,40 60,20 380,20 440,40 440,180 380,200 60,200 0,180" fill="url(#wall-cum)" stroke="#6a5a40" stroke-width="1"/>

    <!-- Techo plano -->
    <polygon points="-8,40 60,12 380,12 448,40 440,52 60,52 -8,52" fill="url(#roof-cum)" stroke="#3a2a1a" stroke-width="1"/>

    <!-- Sombra lateral -->
    <polygon points="380,20 380,200 440,180 440,40" fill="#000" fill-opacity="0.18"/>

    <!-- Ventanas panorámicas (cara frontal) -->
    <rect x="30" y="80" width="320" height="60" fill="#1a2838" stroke="#3a4858" stroke-width="1"/>
    <line x1="100" y1="80" x2="100" y2="140" stroke="#5a6a78" stroke-width="1"/>
    <line x1="170" y1="80" x2="170" y2="140" stroke="#5a6a78" stroke-width="1"/>
    <line x1="240" y1="80" x2="240" y2="140" stroke="#5a6a78" stroke-width="1"/>
    <line x1="310" y1="80" x2="310" y2="140" stroke="#5a6a78" stroke-width="1"/>

    <!-- Reflejo cálido en las ventanas -->
    <rect x="30" y="80" width="320" height="15" fill="#f5a878" fill-opacity="0.3"/>
    <rect x="30" y="125" width="320" height="15" fill="#f5a878" fill-opacity="0.2"/>

    <!-- Puerta lateral -->
    <rect x="380" y="120" width="22" height="55" fill="#3a2a1a"/>

    <!-- Deck/terraza hacia el lago -->
    <polygon points="-20,200 460,200 480,220 -40,220" fill="#8a6a45" stroke="#5a4a30" stroke-width="1"/>
    <line x1="0" y1="200" x2="0" y2="220" stroke="#5a4a30" stroke-width="2"/>
    <line x1="100" y1="200" x2="100" y2="220" stroke="#5a4a30" stroke-width="2"/>
    <line x1="200" y1="200" x2="200" y2="220" stroke="#5a4a30" stroke-width="2"/>
    <line x1="300" y1="200" x2="300" y2="220" stroke="#5a4a30" stroke-width="2"/>
    <line x1="400" y1="200" x2="400" y2="220" stroke="#5a4a30" stroke-width="2"/>

    <!-- Vegetación alrededor -->
    <ellipse cx="-30" cy="200" rx="25" ry="15" fill="#3a5a30" opacity="0.8"/>
    <ellipse cx="480" cy="200" rx="25" ry="15" fill="#3a5a30" opacity="0.8"/>
  </g>

  <!-- Vegetación adelante -->
  <g>
    <ellipse cx="80" cy="420" rx="50" ry="20" fill="#3a5a30" opacity="0.9"/>
    <ellipse cx="720" cy="420" rx="60" ry="22" fill="#3a5a30" opacity="0.9"/>
  </g>

  <!-- Texto / etiqueta -->
  <g transform="translate(40, 50)">
    <text font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.85">CUMBRES DEL LAGO</text>
    <text y="20" font-family="'Inter', sans-serif" font-size="10" fill="#1a2332" fill-opacity="0.65">Querétaro</text>
  </g>

  <g transform="translate(720, 560)">
    <text font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" fill="#fafaf9" fill-opacity="0.85" text-anchor="end">Residencia · 190 m²</text>
  </g>
</svg>