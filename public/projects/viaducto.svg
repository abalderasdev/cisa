<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sky-via" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d4dc"/>
      <stop offset="60%" stop-color="#e0d8cc"/>
      <stop offset="100%" stop-color="#d8cfc0"/>
    </linearGradient>
    <linearGradient id="building-via" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8c2b8"/>
      <stop offset="50%" stop-color="#e8e2d8"/>
      <stop offset="100%" stop-color="#a8a298"/>
    </linearGradient>
    <linearGradient id="shadow-via" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="window-via" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#4a5868"/>
      <stop offset="100%" stop-color="#3a4858"/>
    </linearGradient>
    <linearGradient id="ground-via" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a6a60"/>
      <stop offset="100%" stop-color="#4a4a40"/>
    </linearGradient>
  </defs>

  <!-- Cielo urbano -->
  <rect width="800" height="600" fill="url(#sky-via)"/>

  <!-- Edificios de fondo -->
  <g opacity="0.5">
    <rect x="50" y="200" width="60" height="200" fill="#a8a298"/>
    <rect x="120" y="240" width="80" height="160" fill="#b8b2a8"/>
    <rect x="640" y="180" width="70" height="220" fill="#a8a298"/>
    <rect x="720" y="220" width="50" height="180" fill="#b8b2a8"/>
  </g>

  <!-- Suelo -->
  <rect x="0" y="480" width="800" height="120" fill="url(#ground-via)"/>
  <rect x="0" y="475" width="800" height="5" fill="#3a3a30"/>

  <!-- Edificio principal (torre moderna con varios pisos) -->
  <g transform="translate(220, 100)">
    <!-- Cuerpo principal -->
    <rect x="0" y="0" width="280" height="380" fill="url(#building-via)" stroke="#5a5a50" stroke-width="1"/>

    <!-- Sombra lateral derecha -->
    <rect x="260" y="0" width="20" height="380" fill="url(#shadow-via)"/>

    <!-- Franja superior (azotea) -->
    <rect x="-10" y="-8" width="300" height="14" fill="#5a5a50"/>

    <!-- PB - local comercial (más oscuro, más grande) -->
    <rect x="0" y="320" width="280" height="60" fill="#3a3a30"/>
    <rect x="20" y="335" width="240" height="35" fill="#1a1a15" stroke="#5a4a3a" stroke-width="1"/>
    <rect x="120" y="335" width="40" height="35" fill="#d4c11a" fill-opacity="0.3"/>

    <!-- Ventanas - grid de 6 pisos x 4 ventanas -->
    <g>
      <!-- Piso 6 -->
      <rect x="20" y="20" width="48" height="38" fill="url(#window-via)"/>
      <rect x="78" y="20" width="48" height="38" fill="url(#window-via)"/>
      <rect x="136" y="20" width="48" height="38" fill="url(#window-via)"/>
      <rect x="194" y="20" width="48" height="38" fill="url(#window-via)"/>
      <!-- Reflejos -->
      <rect x="22" y="22" width="20" height="14" fill="#a8c8e0" fill-opacity="0.4"/>
      <rect x="80" y="22" width="20" height="14" fill="#a8c8e0" fill-opacity="0.4"/>
      <rect x="138" y="22" width="20" height="14" fill="#a8c8e0" fill-opacity="0.4"/>
      <rect x="196" y="22" width="20" height="14" fill="#a8c8e0" fill-opacity="0.4"/>

      <!-- Piso 5 -->
      <rect x="20" y="70" width="48" height="38" fill="url(#window-via)"/>
      <rect x="78" y="70" width="48" height="38" fill="url(#window-via)"/>
      <rect x="136" y="70" width="48" height="38" fill="url(#window-via)"/>
      <rect x="194" y="70" width="48" height="38" fill="url(#window-via)"/>

      <!-- Piso 4 -->
      <rect x="20" y="120" width="48" height="38" fill="url(#window-via)"/>
      <rect x="78" y="120" width="48" height="38" fill="url(#window-via)"/>
      <rect x="136" y="120" width="48" height="38" fill="url(#window-via)"/>
      <rect x="194" y="120" width="48" height="38" fill="url(#window-via)"/>

      <!-- Piso 3 -->
      <rect x="20" y="170" width="48" height="38" fill="url(#window-via)"/>
      <rect x="78" y="170" width="48" height="38" fill="url(#window-via)"/>
      <rect x="136" y="170" width="48" height="38" fill="url(#window-via)"/>
      <rect x="194" y="170" width="48" height="38" fill="url(#window-via)"/>

      <!-- Piso 2 -->
      <rect x="20" y="220" width="48" height="38" fill="url(#window-via)"/>
      <rect x="78" y="220" width="48" height="38" fill="url(#window-via)"/>
      <rect x="136" y="220" width="48" height="38" fill="url(#window-via)"/>
      <rect x="194" y="220" width="48" height="38" fill="url(#window-via)"/>

      <!-- Piso 1 -->
      <rect x="20" y="270" width="48" height="38" fill="url(#window-via)"/>
      <rect x="78" y="270" width="48" height="38" fill="url(#window-via)"/>
      <rect x="136" y="270" width="48" height="38" fill="url(#window-via)"/>
      <rect x="194" y="270" width="48" height="38" fill="url(#window-via)"/>
    </g>

    <!-- Balcones -->
    <rect x="68" y="56" width="68" height="3" fill="#5a5a50"/>
    <rect x="126" y="106" width="68" height="3" fill="#5a5a50"/>
    <rect x="68" y="156" width="68" height="3" fill="#5a5a50"/>
    <rect x="184" y="206" width="68" height="3" fill="#5a5a50"/>
    <rect x="68" y="256" width="68" height="3" fill="#5a5a50"/>
    <rect x="126" y="306" width="68" height="3" fill="#5a5a50"/>
  </g>

  <!-- Texto / etiqueta -->
  <g transform="translate(40, 50)">
    <text font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.85">VIADUCTO 14</text>
    <text y="20" font-family="'Inter', sans-serif" font-size="10" fill="#1a2332" fill-opacity="0.6">Ciudad de México</text>
  </g>

  <g transform="translate(720, 560)">
    <text font-family="'Inter', sans-serif" font-size="9" letter-spacing="2" fill="#fafaf9" fill-opacity="0.8" text-anchor="end">24 dept · 1 local</text>
  </g>
</svg>