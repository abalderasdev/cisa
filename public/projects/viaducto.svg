<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#f1ebdc"/>
  <defs>
    <pattern id="grid-via" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid-via)"/>

  <rect x="40" y="40" width="720" height="520" stroke="#1a2332" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  <text x="60" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5">REF · 002 — VIAD</text>
  <text x="740" y="70" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5" text-anchor="end">ESC 1:150</text>

  <!-- Perspectiva axonométrica urbana -->
  <g transform="translate(160, 120)">
    <!-- Suelo / calle -->
    <polygon points="0,360 480,360 420,420 60,420" fill="#1a2332" fill-opacity="0.05" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="200" y="395" font-family="'Inter', sans-serif" font-size="9" fill="#1a2332" fill-opacity="0.6" text-anchor="middle">AV. VIADUCTO</text>

    <!-- Edificio principal (torre) -->
    <g transform="translate(80, 40)">
      <!-- Perspectiva isométrica simple -->
      <polygon points="0,40 60,0 220,0 280,40 280,320 220,360 60,360 0,320" stroke="#1a2332" stroke-width="2" fill="#f1ebdc"/>
      <!-- Lineas horizontales (pisos) -->
      <line x1="0" y1="100" x2="280" y2="100" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="0" y1="160" x2="280" y2="160" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="0" y1="220" x2="280" y2="220" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="0" y1="280" x2="280" y2="280" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <!-- Lineas verticales (departamentos) -->
      <line x1="40" y1="40" x2="40" y2="360" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="80" y1="40" x2="80" y2="360" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="120" y1="40" x2="120" y2="360" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="160" y1="40" x2="160" y2="360" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="200" y1="40" x2="200" y2="360" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <line x1="240" y1="40" x2="240" y2="360" stroke="#1a2332" stroke-width="0.8" stroke-opacity="0.5"/>
      <!-- Pisos marcados -->
      <text x="-10" y="44" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6" text-anchor="end">N+6</text>
      <text x="-10" y="104" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6" text-anchor="end">N+5</text>
      <text x="-10" y="164" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6" text-anchor="end">N+4</text>
      <text x="-10" y="224" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6" text-anchor="end">N+3</text>
      <text x="-10" y="284" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6" text-anchor="end">N+2</text>
      <text x="-10" y="344" font-family="'Inter', sans-serif" font-size="7" fill="#1a2332" fill-opacity="0.6" text-anchor="end">N+1</text>
      <!-- PB local comercial -->
      <text x="140" y="378" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">LOCAL COMERCIAL · PB</text>
      <!-- Cota de altura -->
      <line x1="290" y1="40" x2="290" y2="360" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="295" y="200" font-family="'Inter', sans-serif" font-size="8" fill="#1a2332" fill-opacity="0.6">22 m</text>
    </g>
  </g>

  <g transform="translate(120, 530)">
    <text font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.6">PROYECTO 02 · CIUDAD DE MÉXICO</text>
    <text y="22" font-family="'Fraunces', serif" font-size="22" font-weight="600" fill="#1a2332">Viaducto 14</text>
    <text y="40" font-family="'Inter', sans-serif" font-size="11" fill="#1a2332" fill-opacity="0.7">24 departamentos de 67 m² · 1 local comercial</text>
  </g>

  <g transform="translate(680, 510)">
    <rect x="0" y="0" width="60" height="60" stroke="#1a2332" stroke-width="1" stroke-opacity="0.4" fill="none"/>
    <text x="30" y="20" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">N ↑</text>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#1a2332" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="30" y="42" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">19°22'N</text>
    <text x="30" y="52" font-family="'Inter', sans-serif" font-size="6" fill="#1a2332" fill-opacity="0.5" text-anchor="middle">99°08'O</text>
  </g>
</svg>