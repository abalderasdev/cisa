<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <pattern id="decor-grid-v2" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#1f6e3a" stroke-width="0.4" stroke-opacity="0.3"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1f6e3a" stroke-width="0.4" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#decor-grid-v2)"/>
  <!-- Cruz de coordenadas -->
  <circle cx="100" cy="100" r="3" fill="#1f6e3a"/>
  <line x1="100" y1="20" x2="100" y2="180" stroke="#1f6e3a" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#1f6e3a" stroke-width="0.5" stroke-opacity="0.2"/>
</svg>