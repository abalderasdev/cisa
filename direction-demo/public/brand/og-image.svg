<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Fondo blanco limpio -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- Monograma grande (lado izquierdo) -->
  <g transform="translate(180, 195)">
    <path d="M 120 0
             C 188 0, 240 52, 240 120
             C 240 188, 188 240, 120 240
             C 52 240, 0 188, 0 120
             C 0 52, 52 0, 120 0 Z"
          fill="#1f6e3a"/>
    <path d="M 120 40
             C 60 50, 30 90, 40 150
             C 50 210, 120 230, 180 210
             C 120 205, 90 165, 100 115
             C 110 75, 145 50, 120 40 Z"
          fill="#a3c947"/>
    <path d="M 120 40 C 145 50, 175 70, 185 115 C 145 80, 120 65, 120 40 Z"
          fill="#d4c11a"/>
    <ellipse cx="120" cy="120" rx="52" ry="52" fill="#fafaf9"/>
  </g>

  <!-- Texto derecha -->
  <text x="500" y="240" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="24" font-weight="500" letter-spacing="14" fill="#1a2332" fill-opacity="0.85">GRUPO</text>
  <text x="500" y="380" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="140" font-weight="600" letter-spacing="4" fill="#1a2332">CISA</text>

  <!-- Tagline -->
  <text x="500" y="430" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#1a2332" fill-opacity="0.7">Desarrolladora inmobiliaria</text>
  <text x="500" y="460" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#1a2332" fill-opacity="0.7">CDMX · Estado de México · Querétaro</text>

  <!-- Frase reveladora (parte baja) -->
  <text x="180" y="540" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-style="italic" font-weight="500" fill="#1f6e3a">«Vender un terreno es una operación. Desarrollarlo es un negocio.»</text>

  <!-- Footer URL -->
  <text x="180" y="585" font-family="'Inter', sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#1a2332" fill-opacity="0.5">cisa.mx</text>
</svg>