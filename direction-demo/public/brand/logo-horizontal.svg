<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <!-- Monograma: O con dos hojas -->
  <g transform="translate(10, 10)">
    <!-- Hoja exterior (verde oscuro) -->
    <path d="M 50 5
             C 75 5, 95 25, 95 50
             C 95 75, 75 95, 50 95
             C 25 95, 5 75, 5 50
             C 5 25, 25 5, 50 5
             Z"
          fill="#1f6e3a"/>
    <!-- Hoja interior (verde claro con amarillo) - representa el crecimiento -->
    <path d="M 50 18
             C 30 22, 18 38, 22 58
             C 26 78, 50 88, 70 78
             C 50 75, 38 60, 42 42
             C 46 28, 60 20, 50 18
             Z"
          fill="#a3c947"/>
    <!-- Hoja acento amarillo -->
    <path d="M 50 18
             C 58 22, 68 30, 72 42
             C 60 32, 50 28, 50 18 Z"
          fill="#d4c11a"/>
    <!-- Hueco central (forma de C) -->
    <ellipse cx="50" cy="50" rx="22" ry="22" fill="#fafaf9"/>
  </g>

  <!-- Texto GRUPO -->
  <text x="135" y="42" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="14" font-weight="500" letter-spacing="5" fill="currentColor" fill-opacity="0.75">GRUPO</text>

  <!-- Texto CISA -->
  <text x="135" y="92" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="56" font-weight="600" letter-spacing="2" fill="currentColor">CISA</text>
</svg>