<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg-cod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg-cod)"/>

  <!-- Dos siluetas + edificio central -->
  <g transform="translate(200, 200)">
    <!-- Edificio central (más grande, prominente) -->
    <g transform="translate(0, -50)">
      <polygon points="-50,0 0,-30 50,0 50,80 0,110 -50,80" fill="#e8e0d0" stroke="#5a4830" stroke-width="2"/>
      <!-- Ventanas -->
      <rect x="-30" y="20" width="12" height="12" fill="#3a4858" opacity="0.7"/>
      <rect x="-10" y="5" width="12" height="12" fill="#3a4858" opacity="0.7"/>
      <rect x="10" y="5" width="12" height="12" fill="#3a4858" opacity="0.7"/>
      <rect x="30" y="20" width="12" height="12" fill="#3a4858" opacity="0.7"/>
      <rect x="-30" y="50" width="12" height="12" fill="#3a4858" opacity="0.7"/>
      <rect x="-10" y="35" width="12" height="12" fill="#3a4858" opacity="0.7"/>
      <rect x="10" y="35" width="12" height="12" fill="#3a4858" opacity="0.7"/>
      <rect x="30" y="50" width="12" height="12" fill="#3a4858" opacity="0.7"/>
    </g>

    <!-- Persona izquierda (silueta) -->
    <g transform="translate(-130, 0)">
      <circle cx="0" cy="-30" r="20" fill="#1f6e3a" opacity="0.9"/>
      <path d="M -25 -10 Q -25 -15 -20 -15 L 20 -15 Q 25 -15 25 -10 L 25 50 L -25 50 Z" fill="#1f6e3a" opacity="0.9"/>
      <text x="0" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">SOCIO</text>
    </g>

    <!-- Persona derecha (silueta) -->
    <g transform="translate(130, 0)">
      <circle cx="0" cy="-30" r="20" fill="#1f6e3a" opacity="0.9"/>
      <path d="M -25 -10 Q -25 -15 -20 -15 L 20 -15 Q 25 -15 25 -10 L 25 50 L -25 50 Z" fill="#1f6e3a" opacity="0.9"/>
      <text x="0" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="#1a2332" fill-opacity="0.7" text-anchor="middle">CISA</text>
    </g>

    <!-- Líneas conectoras (manos que se estrechan a través del edificio) -->
    <line x1="-105" y1="20" x2="-50" y2="20" stroke="#1f6e3a" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="50" y1="20" x2="105" y2="20" stroke="#1f6e3a" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Texto -->
  <g transform="translate(200, 360)">
    <rect x="-90" y="-15" width="180" height="30" fill="#1f6e3a" rx="15"/>
    <text font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#fafaf9" text-anchor="middle">CO-DESARROLLO</text>
  </g>
</svg>