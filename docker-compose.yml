# Destination Coolify = red Docker de Supabase (COMPOSE_NETWORK).
# Hostname DB típico: supabase-db. NO publicar 5432.
# Schema `cisa` YA existe en el VPS ABDev: no recrearlo ni crear un Postgres nuevo.
# Volumen cisa-cms-media → /app/media (uploads de la colección Media).
services:
  cisa-cms:
    build:
      context: ./cms
    expose:
      - "3000"
    env_file:
      - cms/.env
    environment:
      PAYLOAD_PUBLIC_SERVER_URL: https://cms.cisa.abdev.io
      PAYLOAD_SCHEMA: cisa
    volumes:
      - cisa-cms-media:/app/media
    networks:
      - cisa-internal
    restart: unless-stopped

volumes:
  cisa-cms-media:

networks:
  cisa-internal:
    external: true
    name: ${COMPOSE_NETWORK:-supabase-network-PLACEHOLDER}
